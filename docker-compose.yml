services:
  db:
    image: postgres:16-alpine
    container_name: barberlab-db
    environment:
      POSTGRES_DB: ${DB_NAME:-barberlab}
      POSTGRES_USER: ${DB_USER:-barberlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-barberlab} -d ${DB_NAME:-barberlab}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barberlab-network

  api-secure:
    build:
      context: .
      dockerfile: infra/docker/api-secure.Dockerfile
    container_name: barberlab-api-secure
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_SECURE_PORT:-3001}
      HOST: ${API_SECURE_HOST:-0.0.0.0}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-barberlab}
      DB_USER: ${DB_USER:-barberlab}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    ports:
      - '${API_SECURE_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - barberlab-network
    profiles:
      - secure

  api-vulnerable:
    build:
      context: .
      dockerfile: infra/docker/api-vulnerable.Dockerfile
    container_name: barberlab-api-vulnerable
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_VULNERABLE_PORT:-3002}
      HOST: ${API_VULNERABLE_HOST:-0.0.0.0}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-barberlab}
      DB_USER: ${DB_USER:-barberlab}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    ports:
      - '${API_VULNERABLE_PORT:-3002}:3002'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - barberlab-network
    profiles:
      - vulnerable

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: barberlab-web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    ports:
      - '5173:80'
    networks:
      - barberlab-network

volumes:
  postgres_data:

networks:
  barberlab-network:
    driver: bridge
